<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05040f" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'none'" />
  <meta name="description" content="NeonKeys — a neon web piano and visualizer. Play with a MIDI keyboard or your computer keyboard, practise with falling notes, record MIDI." />
  <title>NeonKeys</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305040f'/%3E%3Crect x='6' y='6' width='5' height='20' rx='1.5' fill='%2339e6ff'/%3E%3Crect x='13.5' y='6' width='5' height='20' rx='1.5' fill='%238f6bff'/%3E%3Crect x='21' y='6' width='5' height='20' rx='1.5' fill='%23ff3fd8'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="topbar" id="topbar">
    <div class="brand"><span class="brand-mark"></span>Neon<b>Keys</b></div>
    <button class="btn" id="songsBtn"><span class="ico">♫</span><span data-i18n="songs">Songs</span></button>

    <div class="transport" id="transport" hidden>
      <button class="icon-btn" id="restartBtn" title="Restart">⏮</button>
      <button class="icon-btn primary" id="playBtn" title="Play">▶</button>
      <div class="song-meta">
        <div class="song-title" id="songTitle"></div>
        <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <span class="time" id="timeLabel">0:00</span>
      <select id="speedSel" data-i18n-title="speed">
        <option value="0.25">25%</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>
      <div class="seg" id="modeSeg">
        <button data-mode="listen" data-i18n="listen">Listen</button>
        <button data-mode="play" data-i18n="play">Play</button>
        <button data-mode="wait" data-i18n="wait">Wait</button>
      </div>
      <select id="partSel" data-i18n-title="part"></select>
      <button class="icon-btn" id="closeSongBtn" data-i18n-title="close">✕</button>
    </div>

    <div class="spacer"></div>
    <button class="btn rec" id="recBtn"><span class="rec-dot"></span><span id="recLabel" data-i18n="record">Record</span></button>
    <button class="btn" id="midiBtn"><span class="status-dot" id="midiDot"></span><span id="midiLabel">MIDI</span></button>
    <button class="icon-btn" id="helpBtn" data-i18n-title="help">?</button>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="settings">⚙</button>
    <button class="icon-btn" id="fsBtn" data-i18n-title="fullscreen">⛶</button>
  </header>

  <div class="hud" id="hud" hidden>
    <div class="hud-score" id="hudScore">0</div>
    <div class="hud-combo" id="hudCombo"></div>
    <div class="hud-acc" id="hudAcc"></div>
  </div>

  <div class="badges">
    <div class="badge octave" id="octaveBadge">
      <button id="octDown" aria-label="Octave down">‹</button>
      <span id="octLabel">QWERTY C2–C7</span>
      <button id="octUp" aria-label="Octave up">›</button>
    </div>
    <div class="badge pedal" id="pedalBadge">SUSTAIN</div>
    <div class="badge loading" id="loadingBadge" hidden></div>
  </div>

  <button class="range-btn left" id="rangeLeft" hidden aria-label="Scroll keyboard left">‹</button>
  <button class="range-btn right" id="rangeRight" hidden aria-label="Scroll keyboard right">›</button>

  <div class="overlay" id="startOverlay">
    <div class="card hero">
      <h1 class="logo">Neon<b>Keys</b></h1>
      <p class="tagline" data-i18n="tagline">Neon piano &amp; visualizer</p>
      <button class="btn big primary" id="startBtn" data-i18n="start">Start playing</button>
      <p class="muted" data-i18n="startHint"></p>
    </div>
  </div>

  <div class="overlay" id="songsModal" hidden>
    <div class="card">
      <div class="card-head"><h2 data-i18n="songs">Songs</h2><button class="icon-btn" data-close>✕</button></div>
      <h3 data-i18n="demos">Demo pieces</h3>
      <div class="list" id="demoList"></div>
      <button class="btn wide" id="openMidiBtn"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2h8.8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="openMidi">Open MIDI file…</span></button>
      <p class="muted center" data-i18n="dropHint"></p>
      <h3 data-i18n="recordings">Your recordings</h3>
      <div class="list" id="recList"></div>
    </div>
  </div>

  <div class="overlay" id="settingsModal" hidden>
    <div class="card">
      <div class="card-head"><h2 data-i18n="settings">Settings</h2><button class="icon-btn" data-close>✕</button></div>
      <h3 data-i18n="sound">Sound</h3>
      <label class="field"><span data-i18n="instrument"></span>
        <select id="setInstrument">
          <option value="piano" data-i18n="piano"></option>
          <option value="epiano" data-i18n="epiano"></option>
          <option value="synth" data-i18n="synth"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="volume"></span><input type="range" id="setVolume" min="0" max="1" step="0.01" /></label>
      <label class="field"><span data-i18n="reverb"></span><input type="range" id="setReverb" min="0" max="1" step="0.01" /></label>
      <label class="field"><span data-i18n="keyVelocity"></span><input type="range" id="setVelocity" min="20" max="127" step="1" /></label>
      <h3 data-i18n="visuals">Visuals</h3>
      <label class="field"><span data-i18n="labels"></span>
        <select id="setLabels">
          <option value="qwerty" data-i18n="labelsQwerty"></option>
          <option value="notes" data-i18n="labelsNotes"></option>
          <option value="none" data-i18n="labelsNone"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="colors"></span>
        <select id="setColors">
          <option value="rainbow" data-i18n="colorsRainbow"></option>
          <option value="tracks" data-i18n="colorsTracks"></option>
          <option value="mono" data-i18n="colorsMono"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="noteSpeed"></span><input type="range" id="setNoteSpeed" min="0.5" max="2" step="0.05" /></label>
      <label class="field check"><span data-i18n="particles"></span><input type="checkbox" id="setParticles" /></label>
      <label class="field"><span data-i18n="language"></span>
        <select id="setLang">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </label>
      <p class="muted small" data-i18n="credits"></p>
    </div>
  </div>

  <div class="overlay" id="helpModal" hidden>
    <div class="card">
      <div class="card-head"><h2 data-i18n="help">Controls</h2><button class="icon-btn" data-close>✕</button></div>
      <div class="kbd-map" id="kbdMap"></div>
      <ul class="help-list">
        <li data-i18n="helpQwerty"></li>
        <li data-i18n="helpOctave"></li>
        <li data-i18n="helpSustain"></li>
        <li data-i18n="helpMidi"></li>
        <li data-i18n="helpMouse"></li>
        <li data-i18n="helpRecord"></li>
      </ul>
    </div>
  </div>

  <div class="overlay" id="resultsModal" hidden>
    <div class="card results">
      <h2 data-i18n="results">Results</h2>
      <div class="grade" id="resGrade">A</div>
      <div class="res-grid">
        <div><span data-i18n="accuracy"></span><b id="resAcc"></b></div>
        <div><span data-i18n="score"></span><b id="resScore"></b></div>
        <div><span data-i18n="maxCombo"></span><b id="resCombo"></b></div>
      </div>
      <div class="res-counts" id="resCounts"></div>
      <div class="row">
        <button class="btn primary" id="resAgain" data-i18n="again"></button>
        <button class="btn" data-close data-i18n="done"></button>
      </div>
    </div>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden><div>.mid</div></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
