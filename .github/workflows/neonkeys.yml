name: NeonKeys

on:
  push:
    paths: ['neon-keys/**', '.github/workflows/neonkeys.yml']
    tags: ['neonkeys-v*']
  pull_request:
    paths: ['neon-keys/**', '.github/workflows/neonkeys.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: neon-keys

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neon-keys/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: neon-keys/dist

  windows:
    name: Windows installer (.exe)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neon-keys/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: NeonKeys-windows
          path: |
            neon-keys/release/*.exe
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/neonkeys-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NeonKeys-windows
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release create "$GITHUB_REF_NAME" out/*.exe --repo "$GITHUB_REPOSITORY" --title "NeonKeys ${GITHUB_REF_NAME#neonkeys-v}" --generate-notes

  pages:
    name: Deploy web version
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
