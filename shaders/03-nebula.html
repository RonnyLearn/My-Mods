<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Объёмная туманность: реймарчинг столпов газа (fBM 5 октав, доменное искажение), самозатенение в сторону
// ионизирующего скопления, рассеяние (Хеньи–Гринстейн), ионизированные края Hα и диффузный [OIII],
// пульсирующие протозвёзды внутри столпов. Конвейер: сцена (цвет + глубина) -> временное накопление
// (сглаживает шум реймарчинга) -> глубина резкости (тонкая плоскость фокуса) -> bloom -> композит.
(() => {
'use strict';
const cv = document.getElementById('c');
const opt = { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: false };
let gl = cv.getContext('webgl2', opt);
const W2 = !!gl;
if (!gl) gl = cv.getContext('webgl', opt);
if (!gl) { console.error('WebGL недоступен'); return; }

// --- формат HDR-буферов: half float, иначе 8 бит с масштабом ---
let deriv = W2, lod = W2, fmt = null;
if (W2) { if (gl.getExtension('EXT_color_buffer_float')) fmt = { i: gl.RGBA16F, t: gl.HALF_FLOAT, enc: 1 }; }
else {
  deriv = !!gl.getExtension('OES_standard_derivatives');
  lod = !!gl.getExtension('EXT_shader_texture_lod');
  const h = gl.getExtension('OES_texture_half_float');
  gl.getExtension('EXT_color_buffer_half_float');
  if (h && gl.getExtension('OES_texture_half_float_linear')) fmt = { i: gl.RGBA, t: h.HALF_FLOAT_OES, enc: 1 };
}
function mkTex(w, h, f, filt, wrap, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, f.i, w, h, 0, gl.RGBA, f.t, data || null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap || gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap || gl.CLAMP_TO_EDGE);
  return t;
}
function mkTarget(w, h) {
  const tex = mkTex(w, h, fmt), fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h, ok: gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE };
}
const U8 = { i: W2 ? gl.RGBA8 : gl.RGBA, t: gl.UNSIGNED_BYTE, enc: 1 / 16 };
if (fmt) { const t = mkTarget(4, 4); if (!t.ok) fmt = null; gl.deleteFramebuffer(t.fb); gl.deleteTexture(t.tex); }
if (!fmt) fmt = U8;
const ENC = fmt.enc;

// --- шейдеры пишутся на GLSL ES 1.0 и переводятся в 3.00 для WebGL2 ---
function conv(src, frag) {
  let pre = '';
  if (frag) {
    if (deriv) pre += W2 ? '#define HAS_DERIV\n' : '#extension GL_OES_standard_derivatives : enable\n#define HAS_DERIV\n';
    if (!W2 && lod) pre += '#extension GL_EXT_shader_texture_lod : enable\n#define TEXL(s,u) texture2DLodEXT(s,u,0.)\n';
    else if (W2) pre += '#define TEXL(s,u) textureLod(s,u,0.)\n';
    else pre += '#define TEXL(s,u) texture2D(s,u)\n';
  }
  if (!W2) return pre + src;
  src = src.replace(/\battribute\b/g, 'in').replace(/\bvarying\b/g, frag ? 'in' : 'out').replace(/texture2D\s*\(/g, 'texture(');
  if (frag) src = src.replace(/gl_FragColor/g, 'oC').replace('precision highp float;', 'precision highp float;\nout vec4 oC;');
  return '#version 300 es\n' + pre + src;
}
function prog(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, conv('precision highp float;attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}', false)));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, conv(fs, true)));
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const L = {};
  const u = (n) => (n in L ? L[n] : (L[n] = gl.getUniformLocation(p, n)));
  return {
    use() { gl.useProgram(p); return this; },
    f(n, ...v) { const l = u(n); if (l) gl['uniform' + v.length + 'f'](l, ...v); return this; },
    v4(n, v) { const l = u(n); if (l) gl.uniform4fv(l, v); return this; },
    t(n, unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); const l = u(n); if (l) gl.uniform1i(l, unit); return this; },
  };
}

// ============================ СЦЕНА ============================
const SCENE = `precision highp float;
uniform vec2 uRes;uniform float uTime,uTan,uEnc,uFrame;
uniform vec3 uRo,uF,uR,uU;
uniform vec4 uCore[4];               // протозвёзды: позиция, яркость (с пульсацией)
uniform sampler2D uNoise;
const vec3 LDIR=vec3(.39,.78,-.49);  // направление на ионизирующее скопление (вне кадра, сверху-сзади)
const vec3 NAVY=vec3(.003,.0056,.021),VIOL=vec3(.011,.0048,.039),HA=vec3(1.,.147,.069),OIII=vec3(0.,.91,.66);

float n3(vec3 x){vec3 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  vec2 uv=(p.xy+vec2(37.,17.)*p.z)+f.xy;vec2 rg=TEXL(uNoise,(uv+.5)/256.).rg;return mix(rg.x,rg.y,f.z);}
vec4 h43(vec3 p){vec4 q=fract(vec4(p.xyzx)*vec4(.1031,.103,.0973,.1099));q+=dot(q,q.wzxy+33.33);return fract((q.xxyz+q.yzzw)*q.zywx);}
float h12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}

// форма: сужающиеся столпы газа, растущие из плотной гряды облаков
float cone(vec3 p,vec3 a,vec3 b,float r0,float r1){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(r0,r1,h);}
float shape(vec3 p){
  p.x+=.35*sin(p.y*.35+.6);
  float s=cone(p,vec3(-2.4,-7.,.2),vec3(-1.5,2.6,-.4),1.55,.75);
  s=min(s,cone(p,vec3(1.1,-7.,-1.2),vec3(.7,.2,-1.5),1.2,.55));
  s=min(s,cone(p,vec3(3.8,-7.,.9),vec3(3.4,-2.6,1.3),.95,.45));
  float bank=p.y+4.6+.6*sin(p.x*.4)+.4*sin(p.z*.5+1.);
  return min(s,bank);
}
// плотность: форма, изъеденная доменно-искажённым fbm (5 октав); oct — число октав
// разреженный ионизированный газ между столпами (светится [OIII], почти прозрачен)
vec3 OIIIc(vec3 p){float k=smoothstep(-.4,.9,dot(normalize(p+vec3(0.,6.,0.)),LDIR));
  return mix(vec3(.03,.32,.4),mix(OIII,vec3(.55,.95,.85),.35),k)*(.35+.9*k);}
float gasD(vec3 p){return .03*smoothstep(-7.,5.,p.y)*pow(n3(p*.22+3.)*n3(p*.5+9.)*2.,1.5);}
float density(vec3 p,int oct,out float gas){
  float s=shape(p);
  gas=gasD(p);
  if(s>2.4)return 0.;
  vec3 w=vec3(n3(p*.33),n3(p*.33+7.1),n3(p*.33+13.7))*2.-1.;
  vec3 q=p*1.25+w*1.1+vec3(0.,uTime*.012,0.);
  float f=0.,a=.5;
  for(int i=0;i<5;i++){if(i>=oct)break;f+=a*n3(q);q=q*2.07+vec3(1.7,9.2,3.1);a*=.5;}
  f/=1.-2.*a;
  float d=smoothstep(.45,-.35,s+(f-.5)*2.4);
  return d*d*(.6+.8*f);
}
float gJit;
float shadowT(vec3 p){                                  // самозатенение в сторону скопления
  float od=0.,st=.25+.2*gJit,g;
  for(int i=0;i<4;i++){p+=LDIR*st;od+=density(p,2,g)*st;st*=1.9;}
  return exp(-od*7.);
}

// фон: звёзды (яркие — с дифракционными лучами, как у телескопа)
vec3 starLayer(vec3 d,float K,float prob,float pa,float seed,float gain,float spikes){
  vec3 x=d*K,c0=floor(x),o=step(.5,x-c0)*2.-1.;vec3 acc=vec3(0.);
  for(int i=0;i<8;i++){
    vec3 c=c0+vec3(mod(float(i),2.),mod(floor(float(i)*.5),2.),floor(float(i)*.25))*o;
    vec4 h=h43(c+seed);if(h.w>prob)continue;
    vec3 sp=c+h.xyz;float L=length(sp);if(abs(L-K)>.33)continue;
    vec3 dv=sp/L-d;vec2 op=vec2(dot(dv,uR),dot(dv,uU))/pa;   // смещение в пикселях
    float u=h.w/prob,F=gain*.02/(u*u+.015);
    vec3 col=mix(vec3(.75,.85,1.),vec3(1.,.82,.64),smoothstep(.3,.9,fract(u*37.1)));
    float v=exp(-.5*dot(op,op)/.55)*.28;
    if(spikes>0.){float sx=exp(-op.y*op.y*1.4)*exp(-abs(op.x)/(3.+F*6.)),sy=exp(-op.x*op.x*1.4)*exp(-abs(op.y)/(3.+F*6.));
      v+=(sx+sy)*.012*spikes*min(F,6.);}
    acc+=col*F*v;
  }
  return acc;
}
vec3 sky(vec3 d,float pa){
  vec3 c=vec3(.0012,.0014,.0026)*(.6+.8*n3(d*3.));
  return c+starLayer(d,30.,.5,pa,1.,2.,1.)+starLayer(d,90.,.4,pa,7.,.6,0.)+starLayer(d,240.,.35,pa,13.,.22,0.);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 rd=normalize(uF+(uv.x*uR+uv.y*uU)*uTan*2.),ro=uRo;
  float pa=uTan*2./uRes.y;
  // пересечение с ограничивающим ящиком объёма
  vec3 bmin=vec3(-13.,-9.,-9.),bmax=vec3(13.,9.,9.),ir=1./rd;
  vec3 t0=(bmin-ro)*ir,t1=(bmax-ro)*ir,tn=min(t0,t1),tf=max(t0,t1);
  float tN=max(max(max(tn.x,tn.y),tn.z),.3),tF=min(min(tf.x,tf.y),tf.z);
  vec3 col=vec3(0.);float T=1.,dsum=0.,wsum=0.;
  float ph=.5*(1.-.36)/pow(1.+.36-1.2*dot(rd,LDIR),1.5);  // фаза Хеньи–Гринстейна (g=0.6)
  if(tF>tN){
    float jit=fract(h12(gl_FragCoord.xy)+uFrame*.618034);gJit=fract(jit*7.31+.5);
    float t=tN+jit*.25;
    for(int i=0;i<80;i++){
      if(t>tF||T<.015)break;
      vec3 p=ro+rd*t;
      float s=shape(p);
      float dt=.09+.012*t;
      if(s>2.6){                                      // пропуск пустоты кратно шагу (фаза джиттера сохраняется)
        float sk=dt*clamp(floor((s-2.2)/dt),1.,floor(1.1/dt));vec3 pm=ro+rd*(t+sk*.5);col+=T*OIIIc(pm)*gasD(pm)*sk*.55;t+=sk;continue;}
      float gas,dn=density(p,5,gas);
      float Ls=shadowT(p);
      // излучение: ионизированные края (Hα), диффузный [OIII], рассеянный свет, пыль
      float rim=dn*pow(Ls,.6)*smoothstep(.05,.5,dn);
      vec3 e=HA*rim*1.1+OIIIc(p)*gas*Ls*.55*(1.-smoothstep(.0,.3,dn));
      e+=vec3(1.,.8,.62)*dn*Ls*ph*.55;
      e+=mix(NAVY,VIOL,n3(p*.4))*dn*.9;
      for(int k=0;k<4;k++){vec4 C=uCore[k];float r=length(p-C.xyz);
        e+=vec3(1.,.58,.32)*C.w*(dn+.03)*exp(-r*1.5)/(r*r+.06)*.5;}   // подсветка от протозвёзд
      float sig=dn*6.+gas*.2;
      float a=1.-exp(-sig*dt);
      vec3 cstep=e*dt*T*(sig>1e-4?a/(sig*dt):1.);
      col+=cstep;
      float w=T*a;dsum+=w*t;wsum+=w;
      T*=1.-a;t+=dt;
    }
  }
  // сами протозвёзды — компактные ядра, приглушённые окружающей пылью
  for(int k=0;k<4;k++){vec4 C=uCore[k];vec3 oc=C.xyz-ro;float tc=dot(oc,rd);
    float d=length(oc-rd*tc)/(pa*tc);col+=vec3(1.,.8,.62)*C.w*exp(-d*d*.3)*.25*step(0.,tc);}
  col+=T*sky(rd,pa);
  // пылевые вуали переднего плана (сильно размываются глубиной резкости)
  vec3 pv=ro+rd*(4.5/max(dot(rd,uF),.2));
  float vm=smoothstep(.25,.9,length(uv*vec2(.8,1.1))),vn=0.,va=.5;vec3 vq=pv*.7+vec3(uTime*.02,0.,0.);
  for(int i=0;i<4;i++){vn+=va*n3(vq);vq*=2.1;va*=.5;}
  float av=smoothstep(.47,.66,vn/.9375)*vm*.85;
  col=col*(1.-av)+mix(NAVY*3.,HA*.04,vn)*av;
  if(av>.3){wsum=1.;dsum=4.5;T=0.;}
  float depth=wsum>.05?dsum/wsum:80.;
  depth=mix(80.,depth,smoothstep(.05,.4,1.-T));
  gl_FragColor=vec4(col*uEnc,depth/100.);
}
`;

// ============================ BLOOM / БЛИК ============================
const DOWN = `precision highp float;
uniform sampler2D uT;uniform vec2 uSrc,uDst;uniform float uThr,uFirst;
vec3 S(vec2 u){vec3 c=texture2D(uT,u).rgb;
  if(uFirst>.5){float b=max(c.r,max(c.g,c.b));c*=max(b-uThr,0.)/max(b,1e-4);c=min(c,vec3(uThr*60.));}return c;}
void main(){vec2 uv=gl_FragCoord.xy/uDst,hp=.5/uSrc;
  vec3 s=S(uv)*4.+S(uv-hp)+S(uv+hp)+S(uv+vec2(hp.x,-hp.y))+S(uv-vec2(hp.x,-hp.y));
  gl_FragColor=vec4(s/8.,1.);}`;
const UP = `precision highp float;
uniform sampler2D uT,uC;uniform vec2 uSrc,uDst;uniform float uDecay;
vec3 S(vec2 u){return texture2D(uT,u).rgb;}
void main(){vec2 uv=gl_FragCoord.xy/uDst,hp=.5/uSrc;
  vec3 s=S(uv+vec2(-hp.x*2.,0.))+S(uv+vec2(-hp.x,hp.y))*2.+S(uv+vec2(0.,hp.y*2.))+S(uv+hp)*2.
        +S(uv+vec2(hp.x*2.,0.))+S(uv+vec2(hp.x,-hp.y))*2.+S(uv+vec2(0.,-hp.y*2.))+S(uv-hp)*2.;
  gl_FragColor=vec4(s/12.*uDecay+texture2D(uC,uv).rgb,1.);}`;
// временное накопление: экспоненциальное среднее кадров (камера дрейфует медленно — шлейфов нет)
const ACC = `precision highp float;
uniform sampler2D uC,uH;uniform vec2 uRes;uniform float uK;
void main(){vec2 st=gl_FragCoord.xy/uRes;gl_FragColor=mix(texture2D(uH,st),texture2D(uC,st),uK);}`;
// глубина резкости: сбор по спирали, вес по кружку нерезкости самой выборки (scatter-as-gather)
const DOF = `precision highp float;
uniform sampler2D uT;uniform vec2 uRes;uniform float uFocus,uAp,uMax;
float coc(float z){z*=100.;return min(uAp*abs(z-uFocus)/z,uMax);}
void main(){
  vec2 st=gl_FragCoord.xy/uRes;vec4 c0=texture2D(uT,st);float r0=coc(c0.a);
  vec3 s=c0.rgb;float w=1.;
  for(int i=1;i<48;i++){
    float fi=float(i),r=sqrt(fi/47.)*uMax,a=fi*2.39996;
    vec4 c=texture2D(uT,st+vec2(cos(a),sin(a))*r/uRes);
    float rc=coc(c.a),k=smoothstep(r-1.,r+.5,min(rc,max(r0,rc*.999)));
    s+=c.rgb*k;w+=k;
  }
  gl_FragColor=vec4(s/w,c0.a);}`;

// ============================ КОМПОЗИТ ============================
const COMP = `precision highp float;
uniform sampler2D uS,uB;uniform vec2 uRes;uniform float uDec,uTime;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float h12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
void main(){
  vec2 st=gl_FragCoord.xy/uRes,uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 c=(texture2D(uS,st).rgb+texture2D(uB,st).rgb*.07)*uDec;
  c=aces(c*1.2);
  c*=1.-.32*smoothstep(.5,1.3,length(uv*vec2(.85,1.)));
  float g=h12(gl_FragCoord.xy+fract(uTime*7.13)*97.)-.5;
  c+=g*.024*(1.-c)*sqrt(c+.02);
  c=pow(c,vec3(1./2.2));
  c+=(h12(gl_FragCoord.yx+uTime)-.5)/255.;
  gl_FragColor=vec4(c,1.);}`;

let P;
try { P = { scene: prog(SCENE), acc: prog(ACC), dof: prog(DOF), down: prog(DOWN), up: prog(UP), comp: prog(COMP) }; }
catch (e) { console.error(e); return; }

// полноэкранный треугольник
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const draw = (t) => { gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null); gl.viewport(0, 0, t ? t.w : cv.width, t ? t.h : cv.height); gl.drawArrays(gl.TRIANGLES, 0, 3); };

// текстура шума 256x256: R — случайные значения, G — R со сдвигом (37,17)
const nd = new Uint8Array(256 * 256 * 4), rnd = new Uint8Array(256 * 256);
let seed = 1337; for (let i = 0; i < rnd.length; i++) { seed = (seed * 1664525 + 1013904223) >>> 0; rnd[i] = seed >>> 24; }
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
  const o = (y * 256 + x) * 4; nd[o] = rnd[y * 256 + x]; nd[o + 1] = rnd[((y + 17) & 255) * 256 + ((x + 37) & 255)]; nd[o + 3] = 255;
}
const noise = mkTex(256, 256, { i: W2 ? gl.RGBA8 : gl.RGBA, t: gl.UNSIGNED_BYTE }, gl.LINEAR, gl.REPEAT, nd);

// --- цели рендера ---
let S = null, H = [], Dt = null, mips = [], ups = [], fresh = true;
function free(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); } }
function alloc(sw, sh) {
  [S, Dt, ...H, ...mips, ...ups].forEach(free);
  S = mkTarget(sw, sh); Dt = mkTarget(sw, sh); H = [mkTarget(sw, sh), mkTarget(sw, sh)]; mips = []; ups = []; fresh = true;
  let w = sw, h = sh;
  for (let i = 0; i < 7 && Math.min(w, h) > 8; i++) { w = Math.max(1, w >> 1); h = Math.max(1, h >> 1); mips.push(mkTarget(w, h)); }
  for (let i = 0; i < mips.length - 1; i++) ups.push(mkTarget(mips[i].w, mips[i].h));
}

// --- адаптивное разрешение сцены ради 60 FPS ---
const q = new URLSearchParams(location.search);
const fixed = q.has('scale') ? +q.get('scale') : 0;
let scale = fixed || 0.6, hist = [], hold = 0;
function adapt(dt) {
  if (fixed) return;
  hist.push(dt); if (hist.length < 30) return;
  hist.sort((a, b) => a - b); const med = hist[15]; hist = [];
  if (med > 18.5) { scale = Math.max(0.35, scale * 0.88); hold = 4; }
  else if (med < 17.4 && hold-- <= 0) scale = Math.min(1, scale * 1.05);
}

let cw = 0, ch = 0, sw = 0, sh = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w !== cw || h !== ch) { cw = cv.width = w; ch = cv.height = h; }
  const nw = Math.max(64, Math.round(cw * scale)), nh = Math.max(36, Math.round(ch * scale));
  if (!S || Math.abs(nw - sw) > sw * 0.04 || Math.abs(nh - sh) > sh * 0.04 || (nw === cw) !== (sw === cw)) { sw = nw; sh = nh; alloc(sw, sh); }
}

// --- камера медленно дрейфует по нескольким осям; фокус — на столпах ---
let frameN = 0;
function render(t) {
  const yaw = 0.25 * Math.sin(t * 0.021) + 0.1, pit = 0.06 + 0.05 * Math.sin(t * 0.017 + 1), D = 15 - 1.5 * Math.sin(t * 0.013);
  const ro = [D * Math.cos(pit) * Math.sin(yaw), D * Math.sin(pit) - 1, D * Math.cos(pit) * Math.cos(yaw)];
  const tgt = [0.3 + 0.4 * Math.sin(t * 0.019), -1.3, -0.4], f0 = ro.map((x, i) => tgt[i] - x), fl = Math.hypot(...f0), f = f0.map((x) => x / fl);
  const n = Math.hypot(f[2], f[0]), r = [-f[2] / n, 0, f[0] / n];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  // протозвёзды внутри столпов, медленно пульсируют
  const cores = [[-1.7, 1.4, -0.3, 1.0, 0.0], [0.8, -0.4, -1.4, 0.7, 2.1], [3.45, -3.0, 1.2, 0.6, 4.2], [-2.2, -2.8, 0.4, 0.45, 1.3]];
  const cu = [];
  cores.forEach(([x, y, z, b, p]) => cu.push(x, y, z, b * (0.7 + 0.3 * Math.sin(t * 0.55 + p)) * 1.4));
  P.scene.use().t('uNoise', 0, noise).f('uRes', sw, sh).f('uTime', t % 1000).f('uTan', Math.tan(24 * Math.PI / 180) / 2).f('uEnc', ENC).f('uFrame', frameN++ % 4096)
    .f('uRo', ...ro).f('uF', ...f).f('uR', ...r).f('uU', ...u).v4('uCore', cu);
  draw(S);
  // накопление: H[0] — история, H[1] — новый результат
  P.acc.use().t('uC', 0, S.tex).t('uH', 1, H[0].tex).f('uRes', sw, sh).f('uK', fresh ? 1 : 0.3); draw(H[1]); fresh = false;
  H.reverse();
  const focus = Math.hypot(ro[0] - tgt[0], ro[1] - tgt[1], ro[2] - tgt[2]);
  P.dof.use().t('uT', 0, H[0].tex).f('uRes', sw, sh).f('uFocus', focus).f('uAp', sh * 0.0055).f('uMax', q.has('nodof') ? 0.01 : sh * 0.012); draw(Dt);
  let src = Dt;
  mips.forEach((m, i) => { P.down.use().t('uT', 0, src.tex).f('uSrc', src.w, src.h).f('uDst', m.w, m.h).f('uThr', 0.8 * ENC).f('uFirst', i ? 0 : 1); draw(m); src = m; });
  let prev = mips[mips.length - 1];
  for (let i = ups.length - 1; i >= 0; i--) {
    P.up.use().t('uT', 0, prev.tex).t('uC', 1, mips[i].tex).f('uSrc', prev.w, prev.h).f('uDst', ups[i].w, ups[i].h).f('uDecay', 0.85);
    draw(ups[i]); prev = ups[i];
  }
  P.comp.use().t('uS', 0, Dt.tex).t('uB', 1, (ups[0] || mips[0]).tex).f('uRes', cw, ch).f('uDec', 1 / ENC).f('uTime', t % 100);
  draw(null);
}

const t0 = performance.now(); let last = t0;
// ?still=<сек> — один кадр без анимации (для превью и проверки)
if (q.has('still')) { resize(); for (let i = 0; i < 12; i++) render(+q.get('still') || 0); gl.finish(); return; }
function frame(now) {
  requestAnimationFrame(frame);
  adapt(now - last); last = now;
  resize();
  render((now - t0) / 1000);
}
requestAnimationFrame(frame);
})();
</script>
</body>
